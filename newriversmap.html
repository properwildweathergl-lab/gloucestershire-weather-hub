<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gloucestershire Weather Hub - River Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      background-color: #0f4b82;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      color: #0f4b82;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .map-frame {
      width: 100%;
      max-width: 600px;
      height: 480px;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .leaflet-popup-content {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      font-size: 0.9rem;
    }
    .popup-title {
      font-weight: 800;
      color: #0f4b82;
      font-size: 1rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .load-btn {
      background: #0f4b82;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header-card">GLOUCESTERSHIRE RIVER MAP</div>
  
  <div class="map-frame">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Center map precisely over Gloucestershire coordinate bounds
    const map = L.map('map').setView([51.865, -2.245], 10);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Fetch stations within a local radius of Gloucestershire
    async function initCountyMap() {
      try {
        const res = await fetch('https://environment.data.gov.uk/flood-monitoring/id/stations?lat=51.865&long=-2.245&dist=35&parameter=level');
        const data = await res.json();
        
        if (data && data.items) {
          data.items.forEach(st => {
            if (st.lat && st.long) {
              const marker = L.marker([st.lat, st.long]).addTo(map);
              const river = st.riverName || 'Watercourse';
              
              marker.bindPopup(`
                <div class="popup-title">${river}</div>
                <div><b>Station:</b> ${st.label}</div>
                <div id="box-${st.stationReference}" style="margin-top:8px;">
                  <button class="load-btn" onclick="getReading('${st.stationReference}')">View Level</button>
                </div>
              `);
            }
          });
        }
      } catch (e) {
        console.error("Map load error", e);
      }
    }

    window.getReading = async function(ref) {
      const container = document.getElementById(`box-${ref}`);
      container.innerHTML = "Loading live data...";
      try {
        const res = await fetch(`https://environment.data.gov.uk/flood-monitoring/id/stations/${ref}/readings?latest`);
        const json = await res.json();
        if (json && json.items && json.items.length > 0) {
          const val = json.items[0].value.toFixed(2);
          container.innerHTML = `<div style="font-size:1.1rem; font-weight:800; color:#0f4b82; margin-top:4px;">Current Level: ${val} meters</div>`;
        } else {
          container.innerHTML = "No recent data available.";
        }
      } catch (err) {
        container.innerHTML = "Failed to fetch level.";
      }
    }

    initCountyMap();
  </script>
</body>
</html>
