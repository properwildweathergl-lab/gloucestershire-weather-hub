<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloucestershire Weather HUB // Official Public Portal</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f4b82">
    
    <!-- Apple Mobile App Support Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glos Weather">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --logo-navy: #0f4b82;
            --logo-cobalt: #1a6cb5;
            --logo-sun-yellow: #f6b81a;
            --logo-cream-bg: #fdfbf7;
            --logo-hill-green: #3b9b47;
            --card-surface: #ffffff;
            --card-subtle: #f8fafc;
            --border-soft: #e2e8f0;
            --text-heading: #0b355d;
            --text-body: #334155;
            --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--logo-cream-bg);
            color: var(--text-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 2px solid var(--logo-sun-yellow);
            position: sticky; top: 0; z-index: 1000;
            padding: 10px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand-title { font-size: 1.25rem; font-weight: 900; color: var(--logo-navy); }
        .brand-title span { color: var(--logo-cobalt); }
        .container { max-width: 1400px; margin: 0 auto; padding: 14px 18px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .clean-card { background: var(--card-surface); border: 1px solid var(--border-soft); border-radius: 16px; }
        .btn-main-site {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, var(--logo-navy) 0%, var(--logo-cobalt) 100%);
            color: #ffffff; text-decoration: none; font-size: 0.95rem; font-weight: 800;
            padding: 13px 28px; border-radius: 30px; border: 2px solid var(--logo-sun-yellow);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">GLOUCESTERSHIRE <span>WEATHER HUB</span></div>
        <div id="live-clock" style="font-weight: 800; font-size: 0.85rem; color: var(--logo-navy);">--:--:-- BST</div>
    </header>

    <div class="container">
        <!-- MAIN SITE LINK & INSTALL BUTTONS -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; margin-bottom: 6px; width: 100%;">
            <a href="https://glweatherhub.wixsite.com/gloucesterweatherhub" target="_blank" rel="noopener noreferrer" class="btn-main-site">
                🌐 FULL COUNTY FORECAST AND MORE ➔
            </a>
            <button id="install-app-btn" style="background: var(--logo-sun-yellow); color: var(--logo-navy); border: 2px solid var(--logo-navy); padding: 10px 24px; border-radius: 30px; font-weight: 800; font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 12px rgba(246, 184, 26, 0.25);">📱 Install GWH App to Home Screen</button>
        </div>
    </div>

    <!-- Service Worker Registration Script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>

    <!-- Unified Install Button Script -->
    <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    document.getElementById('install-app-btn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
            }
        } else {
            alert("To install this app as a standalone web app:\n\n• On Android/Chrome: Tap your browser menu (three dots) and select 'Install app' or 'Add to Home screen'.\n• On iPhone/Safari: Tap the Share button and select 'Add to Home Screen'.");
        }
    });
    </script>
</body>
</html>
